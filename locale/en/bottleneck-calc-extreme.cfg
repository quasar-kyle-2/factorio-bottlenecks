bottleneck-calc-extreme-help-targets=[font=default-bold]The buildings you selected[/font], grouped by recipe, building and modules, and the speed you want each group to run at.\n\n[font=default-semibold]Speed[/font]: 100% = every building of the group busy all the time. Move a slider, then press [font=default-semibold]Apply[/font] to work the item numbers out for the new speeds (yellow until then). Above 100% plans for more of them than you have.\nThe grey number is what the group makes at that speed.\n\n[font=default-semibold]Click[/font] a building icon to remove those buildings from the targets (click again to add them back). Removing targets, or adding more with the selection tool or Add consumers, waits for [font=default-semibold]Apply[/font], so you can make several changes first.
