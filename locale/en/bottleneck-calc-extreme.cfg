bottleneck-calc-extreme-help-detail=[font=default-bold]Where an item goes and where it comes from[/font], to find out why it runs short.\n\n[font=default-semibold]Goes to[/font]: who consumes it, and whether they get enough. Buildings out of it show where it runs out first.\n[font=default-semibold]Made by[/font]: who makes it, and what holds them back: ingredients of their own that are short, or that they have run out of right now.\n[font=default-semibold]On the way to your targets[/font]: what it mostly becomes, and so which target it holds back.\n[font=default-semibold]Productivity[/font]: where your productivity modules cut the demand for it the most.\n\nThe [img=info] on each section explains its columns. [font=default-semibold]Click[/font] an item icon for its report, or a building icon to show those buildings on the map.\nWhat the buildings are doing is read when the report opens: press refresh to read it again.
bottleneck-calc-extreme-help-prod=[font=default-bold]Where productivity modules cut the demand for this item the most.[/font]\n\nEach row is a group of your buildings that consumes this item, directly or through its ingredients, and that can take a productivity module you have unlocked. The groups where one module saves the most come first.\n\nPut your spare productivity modules in the top groups that are not full yet. If a full group is below one that is not, move its modules up to the higher group: if you are trying to cut the demand for this item, they do more good there.\n\nThe numbers assume each group keeps its current output rate. Productivity modules can slow buildings down: if a group makes less after you add them, build more of its buildings (or give it speed beacons) until it is back to its current output rate.\n\n• [font=default-semibold]draws[/font]: how much of this item the group consumes per second right now, with the modules it has now. This counts what it consumes itself and what goes into making its ingredients.\n• [font=default-semibold]saves[/font]: how much less of this item the group consumes with every slot full than with no modules at all. For a full group, this is what its modules save you now: take them out and it consumes this much more. For a group that is partly filled, some of this is already saved, and filling it gets you the rest.\n• [font=default-semibold]per module[/font]: saves, divided by modules: what each module is worth in this group. The list is sorted by this.\n• [font=default-semibold]modules[/font]: the best productivity module that fits these buildings, and how many it takes to fill every slot of every building in the group. This counts all the slots, including the ones that already hold it, so it is not how many more to add: check [font=default-semibold]filled[/font] for that.\n• [font=default-semibold]filled[/font]: what its slots hold now. Full: that module in every slot. Partly: some productivity, but less than full. None: no productivity modules.\n• [font=default-semibold]outputs[/font]: what the group makes.
bottleneck-calc-extreme-help-prod-modules=[font=default-semibold]modules[/font]: the best productivity module that fits these buildings, and how many it takes to fill every slot of every building in the group. This counts all the slots, including the ones that already hold it, so it is not how many more to add: check [font=default-semibold]filled[/font] for that.
bottleneck-calc-extreme-help-made-by=[font=default-bold]Every building on this surface that makes this item[/font], the ones feeding your targets first.\n\n• [font=default-semibold]makes[/font]: what all of them make at 100%.\n• [font=default-semibold]needed[/font]: what the plan needs them to make for your targets.\n• [font=default-semibold]runs[/font]: how hard the plan runs them, compared to the buildings you have (red: more than you have).\n• [font=default-semibold]byproducts[/font]: their other products.\n• [font=default-semibold]inputs[/font]: their ingredients. Red: short, from the plan: your factory can't make it fast enough for your targets (its coverage is in the tooltip). Sooner or later these run out. Short ones come first.\n• [font=default-semibold]now[/font]: what they are doing right now. "stalled": out of an ingredient.\n• [font=default-semibold]waiting for[/font]: right now. The ingredients the stalled ones have run out of. A short input lands here once it runs out. An ingredient that isn't short can show up for a while too, when its delivery hiccups.
bottleneck-calc-extreme-help-goes-to=[font=default-bold]Every building on this surface that consumes this item[/font], the ones feeding your targets first.\n\n• [font=default-semibold]consumes[/font]: how much of it they consume at the speeds you chose. "—" (not for targets): they consume it for something else, and take it from your targets if they get it first.\n• [font=default-semibold]runs[/font]: how hard the plan runs them, compared to the buildings you have (red: more than you have).\n• [font=default-semibold]outputs[/font]: what they make with it. Red: short (its coverage is in the tooltip), and short ones come first. A short one there is usually why they need more of this item.\n• [font=default-semibold]now[/font]: what they are doing right now. "waiting for it" (red): they have run out of this item, so this is where it runs out first. Watch them fill up after you make more. "stalled": they have run out of another ingredient.\n• [font=default-semibold]waiting for[/font]: which ingredients the stalled ones have run out of.
bottleneck-calc-extreme-help-path=[font=default-bold]What this item mostly becomes, step by step, up to a target[/font], with the coverage of each step.\n\nEach step follows the biggest use. Where a building makes something short, the line follows that, since it is what the building is pushed for.\n\nFurther down this line is often the easier thing to watch: an item on a belt that should be backed up, but is sparse.
