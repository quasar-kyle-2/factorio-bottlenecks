[mod-name]
bottleneck-calc-extreme=Bottleneck Calculator Extreme

[mod-description]
bottleneck-calc-extreme=Select your labs (or any buildings) and set how fast each group should run. Scans the whole surface and shows, item by item, how much their supply chain needs and how much your factory can make: what runs short first, and by how much. Inspired by Production Rates Calculator Extreme.

[shortcut-name]
bottleneck-calc-extreme-shortcut=Bottleneck Calculator Extreme

[controls]
bottleneck-calc-extreme-custom-input=Bottleneck Calculator Extreme

[item-name]
bottleneck-calc-extreme-tool=Bottleneck Calculator Extreme

[item-description]
bottleneck-calc-extreme-tool=Select the buildings you care about (labs, vatbrains, ...). The whole surface is analyzed to find what they need and what runs short.\n[font=default-semibold]Drag[/font]: add targets\n[font=default-semibold]Right-drag[/font]: remove targets

[mod-setting-name]
bottleneck-calc-extreme-track-steam=Track steam
bottleneck-calc-extreme-work-per-tick=Solver work per tick
bottleneck-calc-extreme-use-analyzer=Analyze belts and pipes
bottleneck-calc-extreme-max-rows=Maximum rows per section

[mod-setting-description]
bottleneck-calc-extreme-track-steam=Treat steam as a normal item that can run short, instead of unlimited. Makes the analysis slower (about 5 seconds on a large Pyanodons base).
bottleneck-calc-extreme-work-per-tick=How much solver work runs each tick. The default finishes a large Pyanodons base in about 30 seconds, but the game runs at a few UPS meanwhile. Lower it (e.g. 150000) to keep the game smoother at the cost of a longer wait.
bottleneck-calc-extreme-use-analyzer=Trace belts, inserters and pipes on the whole surface to detect furnace recipes and fluid temperatures. More accurate, but the scan takes longer on big factories.
bottleneck-calc-extreme-max-rows=Longer lists are cut off in the window to keep it responsive.

