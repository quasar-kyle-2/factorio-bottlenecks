bottleneck-calc-extreme-pane-projects=Project recommendations
bottleneck-calc-extreme-help-projects=[font=default-bold]New recipes worth building[/font]: recipes you don't use for your targets yet, each built fresh, without modules, in a type of building you have. Each was tried alone on the plan for the speeds you chose, and the ones that save the most hassle come first.\n\n[font=default-semibold]Hassle[/font] is the one-time effort of fitting in new buildings: a new building costs its width plus one for each belt, pipe, heat pipe or fuel it needs; one more building of a group you have costs its width plus a quarter of that, since its belts are already there. The plan adds new buildings where your factory can't keep up; a good project makes many of them unnecessary.\n\n[font=default-semibold]Rent[/font] is the ongoing running cost: handling the items and fluids that go in and out, and energy.\n\nA short item marked with a red [font=default-bold]![/font] is better handled by one of these projects than by more buildings of what you have.
