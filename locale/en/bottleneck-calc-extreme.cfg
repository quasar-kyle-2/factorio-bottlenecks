bottleneck-calc-extreme-enough=Enough (__1__)
bottleneck-calc-extreme-help-short=[font=default-bold]Items your targets need faster than your factory can make them[/font], lowest coverage first: the first to run out as your targets speed up.\n\n[font=default-semibold]Reading a row:[/font] [item]  needed  can make  difference  coverage\n• [font=default-semibold]needed[/font]: what your targets and everything feeding them use, with every group at the speed you chose. Only what the targets need counts: sinks, buildables and other consumers you didn't select add nothing.\n• [font=default-semibold]can make[/font]: what the buildings making it would make at 100% (modules and beacons included), whether or not they get their own ingredients today.\n• [font=default-semibold]coverage[/font]: can make ÷ needed.\n\nEach item is counted as if everything it needs were there, so a shortage upstream never hides what is needed further down the chain. How you make up the difference is up to you: more buildings, speed or productivity modules, or another recipe.\n\nWhere an item can come from several recipes, loops or byproducts, the calculator uses the buildings you already have first. Where it has to go past them, it picks the extra buildings that are easiest to fit in: smaller, with fewer items and fluids to route, no heat or fuel. An item at exactly 100% is maxed out: what more is needed comes from another route you have.\n\nA red [font=default-bold]![/font] by an item: one of the Project recommendations handles this shortage better than more of the buildings you have (its tooltip names it).\n\n[font=default-semibold]Click[/font] an item for its report: where it goes, where it comes from, and what is waiting for it right now.\n[font=default-semibold]Right-click[/font] an item to treat it as unlimited (green): it is no longer traced to where it comes from.
bottleneck-calc-extreme-help-enough=[font=default-bold]Items your factory can make fast enough[/font] for the speeds you chose, closest to running short first. Read the rows like the ones under Short.\n\nCoverage just above 100% will run short first when you speed up your targets (yellow below 105%); far above, you are making much more than they need. Past 125%, only the most over-covered items are listed.
bottleneck-calc-extreme-inputs=Brought in
bottleneck-calc-extreme-help-inputs=[font=default-bold]Items your supply chain uses, but nothing on this surface makes and nothing can supply[/font], like waste that only comes from burning. They are treated as unlimited.\n\nItems that come from outside (rocket launch results, deliveries from another surface, what you hand-feed, nexelit ore from dig sites) are counted instead: what can be made of them is what came in during the last hour, or what the plan uses if that is more.\n\nItems you switched to unlimited (green icon) are listed here too. Right-click the icon to count it again.
bottleneck-calc-extreme-unlimited=Unlimited
bottleneck-calc-extreme-help-unlimited=[font=default-bold]Always treated as unlimited[/font]: power, heat, fuel and the ash or spent fuel left from burning it, and water at its default temperature. There is always more than enough of them. Steam, water at other temperatures and waste a recipe makes are counted like any other item. Listed so you can see how much is used.
