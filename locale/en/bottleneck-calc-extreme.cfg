bottleneck-calc-extreme-col-coverage-tooltip=Can make ÷ needed. Below 100% the item runs short at the speeds you chose; turned down to this fraction of those speeds, it would just keep up.
bottleneck-calc-extreme-short=Short (__1__)
bottleneck-calc-extreme-enough=Enough (__1__)
bottleneck-calc-extreme-help-short=[font=default-bold]Items your targets need faster than your factory can make them[/font], lowest coverage first: the first to run out as your targets speed up.\n\n[font=default-semibold]Reading a row:[/font] [item]  needed  can make  difference  coverage\n• [font=default-semibold]needed[/font]: what your targets and everything feeding them use, with every group at the speed you chose. Only what the targets need counts: sinks, buildables and other consumers you didn't select add nothing.\n• [font=default-semibold]can make[/font]: what the buildings making it would make at 100% (modules and beacons included), whether or not they get their own ingredients today.\n• [font=default-semibold]coverage[/font]: can make ÷ needed.\n\nEach item is counted as if everything it needs were there, so a shortage upstream never hides what is needed further down the chain. How you make up the difference is up to you: more buildings, speed or productivity modules, or another recipe.\n\nWhere an item can come from several recipes, loops or byproducts, the calculator uses the buildings you already have first. Where it has to go past them, it picks the extra buildings that are easiest to fit in: smaller, with fewer items and fluids to route, no heat or fuel. An item at exactly 100% is maxed out: what more is needed comes from another route you have.\n\n[font=default-semibold]Click[/font] an item for its report: where it goes, where it comes from, and what is waiting for it right now.\n[font=default-semibold]Right-click[/font] an item to treat it as unlimited (green): it is no longer traced to where it comes from.
bottleneck-calc-extreme-help-enough=[font=default-bold]Items your factory can make fast enough[/font] for the speeds you chose, closest to running short first. Read the rows like the ones under Short.\n\nCoverage just above 100% will run short first when you speed up your targets (yellow below 105%); far above, you are making much more than they need. Past 125%, only the most over-covered items are listed.
bottleneck-calc-extreme-inputs=Brought in
bottleneck-calc-extreme-help-inputs=[font=default-bold]Items your supply chain uses, but nothing on this surface makes[/font], for example rocket launch results, items brought in by train from another surface, or something you hand-feed. They are treated as unlimited.\n\nItems you switched to unlimited (green icon) are listed here too. Right-click the icon to count it again.
bottleneck-calc-extreme-unlimited=Unlimited
bottleneck-calc-extreme-help-unlimited=[font=default-bold]Always treated as unlimited[/font]: power, fuel, heat, water, waste that burning leaves behind and nothing refills (ash, spent nuclear fuel) (and steam, unless you turn on "Track steam" in the mod settings), plus what buildings make by script at a rate nothing tells, like nexelit ore from dig sites. There is always more than enough of them, and getting rid of them is not a real use. Listed so you can see how much is used.
bottleneck-calc-extreme-row-used=__1__ used
bottleneck-calc-extreme-item-click-unlimited=[font=default-semibold]Right-click[/font] to treat it as unlimited: it is no longer traced to where it comes from.
bottleneck-calc-extreme-item-click-count=[font=default-semibold]Right-click[/font] to count it again.
bottleneck-calc-extreme-item-right-click=[font=default-semibold]Click[/font] for its report: where it goes and where it comes from.
bottleneck-calc-extreme-detail-title=Item report
bottleneck-calc-extreme-detail-empty=Click an item in the Items pane, or drop one (or its ghost) on this slot, to see its consumption and production details.
bottleneck-calc-extreme-detail-not-found=Nothing on this surface makes or uses __1__.
bottleneck-calc-extreme-detail-pick=Drop an item or fluid here (or its ghost), or [font=default-semibold]click[/font] to pick one, to see its report.
bottleneck-calc-extreme-detail-pick-another=Drop another item or fluid here (or its ghost), or [font=default-semibold]click[/font] to pick one.
bottleneck-calc-extreme-help-detail=[font=default-bold]Where an item goes and where it comes from[/font], to find out why it runs short.\n\n[font=default-semibold]Goes to[/font]: who uses it, and whether they get enough. Buildings out of it show where it runs out first.\n[font=default-semibold]Made by[/font]: who makes it, and what holds them back: ingredients of their own that are short, or that they have run out of right now.\n[font=default-semibold]On the way to your targets[/font]: what it mostly becomes, and so which target it holds back.\n\nThe [img=info] on each section explains its columns. [font=default-semibold]Click[/font] an item icon for its report, or a building icon to show those buildings on the map.\nWhat the buildings are doing is read when the report opens: press refresh to read it again.
bottleneck-calc-extreme-help-made-by=[font=default-bold]Every building on this surface that makes this item[/font], the ones feeding your targets first.\n\n• [font=default-semibold]can make[/font]: what all of them make at 100%.\n• [font=default-semibold]plan makes[/font]: what the plan has them make for your targets.\n• [font=default-semibold]runs[/font]: how hard the plan runs them, compared to the buildings you have (red: more than you have).\n• [font=default-semibold]also makes[/font]: their other products.\n• [font=default-semibold]short inputs[/font]: from the plan. Their ingredients that your factory can't make fast enough for your targets, with their coverage. Sooner or later these run out.\n• [font=default-semibold]now[/font]: what they are doing right now. "stalled": out of an ingredient.\n• [font=default-semibold]waiting for[/font]: right now. The ingredients the stalled ones have run out of. A short input lands here once it runs out. An ingredient that isn't short can show up for a while too, when its delivery hiccups.
bottleneck-calc-extreme-help-goes-to=[font=default-bold]Every building on this surface that uses this item[/font], the ones feeding your targets first.\n\n• [font=default-semibold]uses[/font]: how much of it they use at the speeds you chose. "not for targets": they use it for something else, and take it from your targets if they get it first.\n• [font=default-semibold]runs[/font]: how hard the plan runs them, compared to the buildings you have (red: more than you have).\n• [font=default-semibold]makes[/font]: what they make with it, with its coverage, the shortest first. A short one there is usually why they need more of this item.\n• [font=default-semibold]now[/font]: what they are doing right now. "waiting for it" (red): they have run out of this item, so this is where it runs out first. Watch them fill up after you make more. "stalled": they have run out of another ingredient.\n• [font=default-semibold]waiting for[/font]: which ingredients the stalled ones have run out of.
bottleneck-calc-extreme-help-path=[font=default-bold]What this item mostly becomes, step by step, up to a target[/font], with the coverage of each step.\n\nEach step follows the biggest use. Where a building makes something short, the line follows that, since it is what the building is pushed for.\n\nFurther down this line is often the easier thing to watch: an item on a belt that should be backed up, but is sparse.
